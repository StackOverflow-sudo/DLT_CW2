[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-planet-cw2"
version = "0.1.0"
description = "COMP6252 coursework project for Planet Amazon multi-label satellite image classification."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "pandas>=2.0",
  "numpy>=1.24",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]
