seed: 42

data:
  root_dir: data/raw
  csv_file: data/raw/train_v2.csv
  image_dir: data/raw/train-jpg
  val_size: 0.2
  num_workers: 0

model:
  name: resnet18
  pretrained: false
  num_labels: 17

training:
  epochs: 1
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  image_size: 128
  threshold: 0.2
  device: cpu

outputs:
  dir: outputs
  checkpoint: outputs/quick_best_model.pt
  metrics_file: outputs/quick_metrics.json
