seed: 42

data:
  root_dir: data/raw
  csv_file: data/raw/train_v2.csv
  image_dir: data/raw/train-jpg
  val_size: 0.2
  num_workers: 2

model:
  name: simple_cnn
  pretrained: false
  num_labels: 17

training:
  epochs: 5
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.00001
  image_size: 128
  threshold: 0.2
  device: auto

outputs:
  dir: outputs
  checkpoint: outputs/baseline_cnn_best_model.pt
  metrics_file: outputs/baseline_cnn_metrics.json
